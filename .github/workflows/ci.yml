name: Local MVP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHIELDMATE_DATABASE_URL: sqlite:///./storage/ci.db
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --project backend
      - working-directory: backend
        run: |
          uv run --frozen pytest -q
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy app
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
          uv run --frozen pip-audit
      - name: Offline research and publication tools
        run: |
          backend/.venv/bin/pytest scripts/tests -q
          backend/.venv/bin/ruff check --config backend/pyproject.toml scripts/research scripts/research_evidence.py scripts/publication scripts/tests scripts/verify-phase-08-pdfs.py
          backend/.venv/bin/ruff format --check --config backend/pyproject.toml scripts/research scripts/research_evidence.py scripts/publication scripts/tests scripts/verify-phase-08-pdfs.py
          backend/.venv/bin/mypy --strict scripts/research scripts/research_evidence.py scripts/publication
          python -S scripts/research_evidence.py scenario
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run format:check
          npm run i18n:check
          npm run build
          npm audit
      - run: node --test --test-reporter=tap scripts/tests/qa-runtime.test.cjs
