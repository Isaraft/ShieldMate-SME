[project]
name = "shieldmate-backend"
version = "0.0.0"
description = "ShieldMate Phase 00 API foundation"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2.0",
  "uvicorn>=0.34,<1.0",
  "argon2-cffi>=25.1.0",
  "dnspython==2.8.0",
  "tldextract==5.3.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
  "pip-audit>=2.8,<3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
