map $upstream_http_cache_control $response_cache {
    default "no-store";
    "private, no-store" "private, no-store";
}
map $http_host $local_host {
    default 0;
    '~^(localhost|127[.]0[.]0[.]1)(:[0-9]{1,5})?$' 1;
}
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    if ($local_host = 0) { return 400; }
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $response_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 3s;
        set $api_backend http://backend:8000;
        proxy_pass $api_backend;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
